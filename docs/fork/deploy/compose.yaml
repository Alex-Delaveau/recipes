# Tandoor (fork) stack for Komodo. Same layout as upstream's docs/install/docker/plain/docker-compose.yml:
# only the web image changes, so switching between the fork and upstream is a one-variable change.
# Variables come from the stack environment in Komodo (or a .env file next to this file), see fork.env.example.
services:
  db_recipes:
    restart: always
    image: postgres:16-alpine
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web_recipes:
    restart: always
    # fork: ghcr.io/alex-delaveau/recipes:<release>-fork.<n> ; back to upstream: vabene1111/recipes:<release>
    image: ${TANDOOR_IMAGE:?set TANDOOR_IMAGE}
    env_file:
      - ./.env
    ports:
      - ${TANDOOR_HTTP_PORT:-80}:80
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      - ./mediafiles:/opt/recipes/mediafiles
    depends_on:
      db_recipes:
        condition: service_healthy

volumes:
  staticfiles:
