# Fork: builds the Docker image of the fork and publishes it on GHCR.
#   push to main / manual run -> ghcr.io/<owner>/recipes:<upstream release>-fork.<n>, :fork-latest, :sha-<commit>
#   pull request              -> build only (no push), when the image inputs change
# The upstream Dockerfile is used unchanged; the Vue 3 front is built first, as upstream's own workflow does.
name: Fork image

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - boot.sh
      - requirements.txt
      - vue3/package.json
      - vue3/yarn.lock
      - scripts/fork/image_tag.sh
      - .github/workflows/fork-image.yml

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    if: github.repository_owner != 'TandoorRecipes'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history for the image tag and version.py
      - name: Fetch upstream release tags
        # the fork's own tags may lag behind after an upstream sync; the image tag names the real base release
        run: git fetch -q --tags https://github.com/TandoorRecipes/recipes.git master

      - name: Image name and tags
        id: tag
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recipes"
          VERSION=$(scripts/fork/image_tag.sh)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOT"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:fork-latest"
            echo "$IMAGE:sha-${GITHUB_SHA::7}"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"
          echo "### Image \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: vue3/yarn.lock
      - name: Build the front
        working-directory: ./vue3
        run: yarn install --frozen-lockfile && yarn build

      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Tandoor Recipes (fork)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
